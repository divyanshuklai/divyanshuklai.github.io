<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pdf-text-layer.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Divyansh Shukla</h1>
            <ul class="social-links">
                <li><a href="https://www.linkedin.com/in/divyansh-shukla-ai/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
                <li><a href="https://x.com/divshkl" target="_blank" rel="noopener noreferrer">X</a></li>
                <li><a href="https://github.com/divyanshuklai" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            </ul>
        </header>

        <div class="wrapper">
            <aside class="sidebar">
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="projects.html">Projects</a></li>
                        <li><a href="research.html">Research</a></li>
                    </ul>
                </nav>
            </aside>

            <main>
                <section id="resume">
                    <h2>Resume</h2>

                    <div class="pdf-viewer" id="resume-viewer" data-pdf-src="resume/resume_2_26_aug.pdf">
                        <div class="pdf-toolbar">
                            <div class="pdf-toolbar-group">
                                <button type="button" class="pdf-btn" data-pdf-action="zoom-out" aria-label="Zoom out" title="Zoom out">&minus;</button>
                                <span class="pdf-zoom" data-pdf-role="zoom" aria-live="polite" aria-label="Zoom level"></span>
                                <button type="button" class="pdf-btn" data-pdf-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
                                <button type="button" class="pdf-btn" data-pdf-action="fit" title="Fit the page to the width">Fit</button>
                            </div>
                            <div class="pdf-toolbar-group">
                                <button type="button" class="pdf-btn" data-pdf-action="fullscreen" title="Full screen">Full screen</button>
                                <a class="pdf-btn" href="resume/resume_2_26_aug.pdf" download>Download</a>
                                <a class="pdf-btn" href="resume/resume_2_26_aug.pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
                            </div>
                        </div>

                        <div class="pdf-stage" data-pdf-role="stage" tabindex="0" role="img" aria-label="Resume, one page">
                            <div class="pdf-page" data-pdf-role="page">
                                <canvas data-pdf-role="canvas"></canvas>
                                <div class="textLayer" data-pdf-role="text"></div>
                            </div>
                        </div>

                        <p class="pdf-status" data-pdf-role="status">Loading the resume&hellip;</p>
                    </div>

                    <noscript>
                        <p>The viewer needs JavaScript. <a href="resume/resume_2_26_aug.pdf" download>Download the resume (PDF)</a> instead.</p>
                    </noscript>
                </section>
            </main>
        </div>

        <footer>

    </div>

    <script src="js/main.js"></script>
    <script type="module" src="js/resume-viewer.js"></script>
</body>
</html>
